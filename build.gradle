// Root build: shared settings for the common, fabric and neoforge subprojects.
// Architectury Loom is only a build plugin; nothing from it ends up in the mod jars.
plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.2.21' apply false
}

architectury {
    minecraft = project.minecraft_version
}

// Catch typos in test_profile instead of quietly loading the wrong test mods
def testProfiles = ['vanilla', 'megashowdown', 'genesis']
if (!testProfiles.contains(project.test_profile)) {
    throw new GradleException("test_profile must be one of ${testProfiles}, not '${project.test_profile}'")
}

allprojects {
    group = rootProject.mod_group_id
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'

    base {
        archivesName = "${rootProject.mod_id}-${project.name}"
    }

    // No CurseForge Maven
    repositories {
        maven { url "https://maven.wispforest.io/releases" }                      // Accessories (+ owo-lib)
        maven { url "https://maven.su5ed.dev/releases" }                          // libraries Accessories needs
        maven { url "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" } // GeckoLib
        maven { url "https://maven.parchmentmc.org" }                             // Parchment parameter names
        maven { url "https://maven.neoforged.net/releases" }                      // NeoForge
        maven { url "https://artefacts.cobblemon.com/releases" }                  // Cobblemon (test only)
        maven { url "https://thedarkcolour.github.io/KotlinForForge/" }           // Kotlin for Forge (test only)
        maven { url "https://maven.architectury.dev/" }                           // Architectury API (test only, Mega Showdown needs it)
        maven { url "https://maven.nucleoid.xyz" }                                // Polymer (test only, step 6.5)
        maven { url "https://maven.ladysnake.org/releases" }                       // Cardinal Components (test only, Trinkets needs it)
        maven { url "https://maven.bawnorton.com/releases" }                       // MixinSquared (test only, Accessories Compat Layer needs it)
        mavenCentral()                                                             // Adventure, permissions API (test only, Genesis Forms needs them)
        exclusiveContent {                                                         // Modrinth, only for mods without their own Maven
            forRepository { maven { url "https://api.modrinth.com/maven" } }
            filter { includeGroup "maven.modrinth" }
        }
    }

    configurations.configureEach {
        resolutionStrategy.force "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    }

    dependencies {
        minecraft "net.minecraft:minecraft:${rootProject.minecraft_version}"
        mappings loom.layered {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${rootProject.parchment_minecraft_version}:${rootProject.parchment_mappings_version}@zip")
        }
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
        it.options.encoding = 'UTF-8'
    }
}