// Code shared by both loaders
architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    interfaceInjection {
        enableDependencyInterfaceInjection = false
    }
}

dependencies {
    // Shared mixin annotations
    modCompileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    // Compile only: the mod runs without Accessories
    modCompileOnly "io.wispforest:accessories-common:${rootProject.accessories_version}"

    modCompileOnly("software.bernie.geckolib:geckolib-fabric-1.21.1:${rootProject.geckolib_version}") { transitive = false }
}
