plugins {
    id 'com.github.johnrengelman.shadow'
    id 'org.jetbrains.kotlin.jvm'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    modCompileOnly "io.wispforest:accessories-fabric:${rootProject.accessories_version}"
    // For compat/PolymerAccessoriesSync, only runs with Polymer installed
    modCompileOnly "eu.pb4:polymer-core:${rootProject.polymer_version}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-1.21.1:${rootProject.geckolib_version}"

    // Test only, picked by test_profile in gradle.properties
    def profile = rootProject.test_profile
    if (profile != 'vanilla') {
        modLocalRuntime "io.wispforest:accessories-fabric:${rootProject.accessories_version}"
        modLocalRuntime "com.cobblemon:fabric:${rootProject.cobblemon_version}"
        modLocalRuntime "net.fabricmc:fabric-language-kotlin:${rootProject.fabric_kotlin_version}"
    }
    if (profile == 'megashowdown') {
        modLocalRuntime "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"
        modLocalRuntime "maven.modrinth:cobblemon-mega-showdown:${rootProject.megashowdown_fabric_id}"
    }
    // Same mods as the Genesis Forms server
    if (profile == 'genesis') {
        modLocalRuntime "maven.modrinth:cobblemon-genesis-forms:${rootProject.genesisforms_id}"
        // Libraries Genesis Forms bundles, plus Polymer
        modLocalRuntime "me.lucko:fabric-permissions-api:${rootProject.fabric_permissions_api_version}"
        modLocalRuntime "net.kyori:adventure-text-minimessage:${rootProject.adventure_minimessage_version}"
        modLocalRuntime "net.kyori:adventure-platform-fabric:${rootProject.adventure_platform_fabric_version}"
        modLocalRuntime "eu.pb4:factorytools:${rootProject.factorytools_version}"
        modLocalRuntime "eu.pb4:polymer-core:${rootProject.polymer_version}"
        modLocalRuntime "eu.pb4:polymer-blocks:${rootProject.polymer_version}"
        modLocalRuntime "eu.pb4:polymer-resource-pack:${rootProject.polymer_version}"
        modLocalRuntime "eu.pb4:polymer-virtual-entity:${rootProject.polymer_version}"
        modLocalRuntime "maven.modrinth:trinkets:${rootProject.trinkets_id}"
        modLocalRuntime "org.ladysnake.cardinal-components-api:cardinal-components-base:${rootProject.cardinal_components_version}"
        modLocalRuntime "org.ladysnake.cardinal-components-api:cardinal-components-entity:${rootProject.cardinal_components_version}"
        modLocalRuntime "maven.modrinth:accessories-compat-layer:${rootProject.accessories_compat_layer_fabric_id}"
        modLocalRuntime "com.github.bawnorton.mixinsquared:mixinsquared-fabric:${rootProject.mixinsquared_version}"
    }
}

loom {
    runs {
        // Separate folder so a dev server and client can run together
        server {
            runDir "run/server"
            // owo-lib's dev-only registry entries make normal clients disconnect
            vmArg "-Dowo.debug=false"
        }
    }
}

// Cobblemon's battles need ICU, which Loom strips from runServer as a client library. 71.1 matches Cobblemon
if (rootProject.test_profile != 'vanilla') {
    tasks.named('runServer') {
        classpath(configurations.detachedConfiguration(dependencies.create('com.ibm.icu:icu4j:71.1')))
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
