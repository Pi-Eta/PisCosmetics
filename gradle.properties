org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
loom.ignoreDependencyLoomVersionValidation=true
kotlin.stdlib.default.dependency=false

## Platforms built from the common code
enabled_platforms=fabric,neoforge

## Minecraft and mappings
minecraft_version=1.21.1
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Loaders
fabric_loader_version=0.17.3
fabric_api_version=0.116.7+1.21.1
neoforge_version=21.1.229

## Libraries
geckolib_version=4.9.3
accessories_version=1.1.0-beta.53+1.21.1

## Test mods
# Which mods the dev game loads: vanilla (no Accessories), megashowdown, or genesis (Fabric only, like the
# Genesis Forms server). Override with -Ptest_profile=...
test_profile=megashowdown
cobblemon_version=1.8.2+1.21.1
architectury_api_version=13.0.8
fabric_kotlin_version=1.13.7+kotlin.2.2.21
neoforge_kotlin_version=5.10.0
# Modrinth IDs
megashowdown_fabric_id=aNO1eGQi
megashowdown_neoforge_id=3IRAvd29
# Modrinth version IDs for the genesis profile (Fabric only)
genesisforms_id=G0i9E3G3
trinkets_id=JagCscwi
accessories_compat_layer_fabric_id=pWxabbaf
polymer_version=0.9.19+1.21.1
# Trinkets needs Cardinal Components API (base + entity), from Ladysnake's Maven
cardinal_components_version=6.1.3
# Libraries Genesis Forms and Accessories Compat Layer bundle inside their jars. Loom doesn't load bundled
# (jar-in-jar) libraries of test mods, so the dev game needs them listed separately.
mixinsquared_version=0.3.4
fabric_permissions_api_version=0.3.1
adventure_minimessage_version=4.17.0
adventure_platform_fabric_version=5.14.1
factorytools_version=0.3.2+1.21

